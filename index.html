<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4C5C">
<title>لسان</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--teal:#0F4C5C;--sand:#F3E9D2;--gold:#F2A541;--coral:#E4572E;--ink:#14232B;--ok:#2E8B57;--card:#fffaf0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:16px;min-height:100vh}
h1{font-size:44px;font-weight:800;color:var(--teal);line-height:1.1}
h2{font-size:22px;font-weight:800;margin-bottom:12px}
p.sub{opacity:.75;margin:6px 0 20px}
input{width:100%;padding:14px;border:2px solid #d9cfb6;border-radius:12px;font:inherit;background:var(--card);margin-bottom:10px;direction:ltr;text-align:right}
input:focus{outline:3px solid var(--gold);border-color:var(--teal)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;background:var(--teal);color:#fff;width:100%;border-bottom:4px solid #0a3641}
button:active{transform:translateY(2px);border-bottom-width:2px}
button:disabled{opacity:.4}
button.alt{background:transparent;color:var(--teal);border:2px solid var(--teal);margin-top:10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-weight:800;gap:8px}
.bar span{background:var(--card);padding:6px 12px;border-radius:20px}
.lang{display:flex;align-items:center;gap:14px;background:var(--card);padding:14px;border-radius:16px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;font-weight:700}
.lang:active{border-color:var(--teal)}
.lang b{font-size:28px}
.unit{background:var(--teal);color:#fff;border-radius:16px;padding:12px 16px;margin:18px 0 14px;font-weight:800}
.unit small{display:block;font-weight:400;opacity:.8}
.node{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:12px 0;background:var(--gold);color:var(--ink);border-bottom:6px solid #c2811f;cursor:pointer;flex-direction:column}
.node.done{background:var(--ok);color:#fff;border-bottom-color:#1d6b3f}
.node.lock{background:#cfc6ae;color:#8a826b;border-bottom-color:#b3aa92;cursor:not-allowed}
.node small{font-size:11px;font-weight:400}
.row{display:flex}.row.c1{justify-content:center}.row.c2{justify-content:flex-start;padding-inline-start:20%}.row.c3{justify-content:flex-end;padding-inline-end:20%}
.prog{height:12px;background:#d9cfb6;border-radius:8px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.q{font-size:26px;font-weight:800;margin:26px 0 8px}
.rom{opacity:.7;margin-bottom:14px}
.opt{display:block;background:var(--card);border:2px solid #d9cfb6;border-bottom-width:4px;color:var(--ink);margin-bottom:10px;text-align:center}
.opt.sel{border-color:var(--teal);background:#dcebe9}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-bottom:2px solid #d9cfb6;margin-bottom:16px;direction:ltr}
.chip{width:auto;padding:10px 14px;background:var(--card);color:var(--ink);border:2px solid #d9cfb6}
.fb{position:fixed;inset:auto 0 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));font-weight:800}
.fb.ok{background:#cdeedb;color:#1d6b3f}.fb.no{background:#f9d4ca;color:#9b2c12}
.fb button{margin-top:10px}
.sp{height:150px}
.big{font-size:64px;text-align:center;margin:30px 0 6px}
.toast{background:var(--coral);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px}
.ltr{direction:ltr;text-align:right}
.lvl{background:var(--card);border:2px dashed var(--teal);color:var(--teal);border-radius:12px;padding:8px 12px;margin:20px 0 8px;font-weight:800;text-align:center}
.node small b{font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
const URL_='https://bkvjwqejoiqcguqzrdun.supabase.co';
const KEY_='sb_publishable_UyZnF1-3fEIX8p2M8xY63A__9gS-FTO';
const sb=supabase.createClient(URL_,KEY_);
const app=document.getElementById('app');
const TTS={en:'en-US',tr:'tr-TR',fr:'fr-FR',es:'es-ES',zh:'zh-CN',ko:'ko-KR',hi:'hi-IN'};
const S={user:null,p:null,langs:[],lang:null,ex:[],i:0,right:0,sel:null,picked:[],opts:[],fb:null,lesson:null,retried:{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/ı/g,'i').replace(/œ/g,'oe').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?¿¡'"’؟،？，]/g,'').replace(/\s+/g,' ').trim();
const today=()=>new Date().toISOString().slice(0,10);
const toast=m=>`<div class="toast">${esc(m)}</div>`;

async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  S.user=session.user;
  await loadProfile();
  S.langs=(await sb.from('languages').select('*').order('sort_order')).data||[];
  const saved=localStorage.getItem('lisan_lang');
  S.lang=S.langs.find(l=>l.id===saved)||null;
  S.lang?mapView():langView();
}

async function loadProfile(){
  let{data:p}=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  if(!p){await sb.from('profiles').insert({id:S.user.id});p=(await sb.from('profiles').select('*').eq('id',S.user.id).single()).data}
  if(p.last_active&&p.last_active!==today()&&p.hearts<5){p.hearts=5;await sb.from('profiles').update({hearts:5}).eq('id',S.user.id)}
  S.p=p;
}

function authView(msg=''){
  app.innerHTML=`<div style="padding-top:40px"><h1>لسان</h1><p class="sub">تعلّم سبع لغات خطوة بخطوة، من جوالك.</p>${msg?toast(msg):''}
  <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
  <input id="pw" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
  <button id="in">تسجيل الدخول</button><button id="up" class="alt">إنشاء حساب جديد</button></div>`;
  const v=()=>[document.getElementById('em').value.trim(),document.getElementById('pw').value];
  document.getElementById('in').onclick=async()=>{const[e,p]=v();const{error}=await sb.auth.signInWithPassword({email:e,password:p});error?authView('تعذّر الدخول: تأكد من البريد وكلمة المرور'):boot()};
  document.getElementById('up').onclick=async()=>{const[e,p]=v();const{data,error}=await sb.auth.signUp({email:e,password:p});if(error)return authView('تعذّر إنشاء الحساب: '+error.message);data.session?boot():authView('تم إنشاء الحساب. فعّل بريدك ثم سجّل الدخول.')};
}

function topbar(back){
  const p=S.p,l=S.lang;
  return `<div class="bar">${back?`<span onclick="langView()" style="cursor:pointer">${l?l.flag:''} ${l?esc(l.name_ar):''} ▾</span>`:'<span></span>'}<span>🔥 ${p.streak}</span><span>❤️ ${p.hearts}</span><span>⭐ ${p.xp}</span></div>`;
}

function langView(){
  app.innerHTML=topbar(false)+`<h2>شو اللغة اللي بدك تتعلمها؟</h2>`+S.langs.map(l=>`<div class="lang" data-id="${l.id}"><b>${l.flag}</b><div>${esc(l.name_ar)}<div class="ltr" style="font-weight:400;opacity:.7;text-align:right">${esc(l.name_native)} · الشرح بال${l.instruction_lang==='ar'?'عربي':'إنجليزي'}</div></div></div>`).join('')+`<button class="alt" id="out">تسجيل الخروج</button>`;
  app.querySelectorAll('.lang').forEach(el=>el.onclick=async()=>{
    S.lang=S.langs.find(l=>l.id===el.dataset.id);
    localStorage.setItem('lisan_lang',S.lang.id);
    await sb.from('user_courses').upsert({user_id:S.user.id,language_id:S.lang.id});
    mapView();
  });
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();localStorage.removeItem('lisan_lang');authView()};
}

const NAMES={es:'Spanish',fr:'French',tr:'Turkish'};
const LATIN=['en','es','fr','tr'];
const LVL=['سهل','متوسط','صعب'];
const CACHE={};let UID=0;
const shuf=a=>a.slice().sort(()=>Math.random()-.5);

async function mapView(){
  app.innerHTML=topbar(true)+'<p class="sub">جاري التحميل…</p>';
  const{data:units}=await sb.from('units').select('*, lessons(*)').eq('language_id',S.lang.id).order('sort_order');
  const{data:prog}=await sb.from('user_progress').select('lesson_id').eq('user_id',S.user.id).limit(2000);
  const done=new Set((prog||[]).map(r=>r.lesson_id));
  let html=topbar(true),prev=true,n=0;
  if(!units||!units.length)html+='<h2>لا توجد دروس بعد</h2><p class="sub">شغّل ملفات SQL الخاصة بالمحتوى في Supabase.</p>';
  (units||[]).forEach((u,ui)=>{
    const ar=S.lang.instruction_lang==='ar';
    html+=`<div class="unit">القسم ${ui+1} · ${esc(ar?u.title_ar:u.title_en)}<small>${esc(ar?u.title_en:u.title_ar)}</small></div>`;
    (u.lessons||[]).sort((a,b)=>a.sort_order-b.sort_order).forEach(ls=>{
      const o=ls.sort_order,lv=Math.min(2,Math.floor((o-1)/10));
      if(o%10===1)html+=`<div class="lvl">المستوى ${lv+1} · ${LVL[lv]}</div>`;
      const d=done.has(ls.id),open=prev||d,cls=d?'done':open?'':'lock';
      html+=`<div class="row c${(n%3)+1}"><div class="node ${cls}" data-id="${open?ls.id:''}" data-xp="${ls.xp_reward}" data-d="${d?1:0}" data-o="${o}" data-u="${u.id}">${d?'✓':open?'▶':'🔒'}<small>${o%10===0?o+' ❤️':o}</small></div></div>`;
      prev=d;n++;
    });
  });
  app.innerHTML=html;
  app.querySelectorAll('.node').forEach(el=>el.onclick=()=>el.dataset.id&&startLesson(+el.dataset.id,+el.dataset.xp,el.dataset.d==='1',+el.dataset.o,+el.dataset.u));
}

function buildStage(order,V,SN){
  const g=(order-1)%10,lv=Math.min(2,Math.floor((order-1)/10)),lg=S.lang.id,ar=lg==='en',latin=LATIN.includes(lg);
  const ws=V.slice(3*g,3*g+3);
  const mk=(type,prompt,answer,options,rom,aud)=>({id:++UID,type,prompt,answer,options,romanization:rom||null,audio_text:aud||null});
  const dis=(w,key,n)=>{
    let pool=V.filter(x=>x.idx!==w.idx);
    if(lv===2){const pk=Math.floor((w.idx-1)/6),near=pool.filter(x=>Math.floor((x.idx-1)/6)===pk);if(near.length>=n)pool=near}
    const seen=new Set([w[key]]),out=[];
    for(const x of shuf(pool)){if(!seen.has(x[key])){seen.add(x[key]);out.push(x[key]);if(out.length===n)break}}
    return out;
  };
  const k=lv===0?2:3;
  let out=[];
  ws.forEach(w=>{
    const t2m=()=>mk('choice',ar?`ماذا تعني "${w.word}"؟`:`What does "${w.word}" mean?`,w.meaning,shuf([w.meaning,...dis(w,'meaning',k)]),w.romanization,w.word);
    const m2t=()=>mk('choice',ar?`كيف تقول "${w.meaning}"؟`:`How do you say "${w.meaning}"?`,w.word,shuf([w.word,...dis(w,'word',k)]));
    const lis=()=>mk('listen',ar?'اسمع واختر المعنى':'Listen and choose the meaning',w.meaning,shuf([w.meaning,...dis(w,'meaning',3)]),null,w.word);
    const typ=()=>latin?mk('write',ar?`اكتب بالإنجليزي: "${w.meaning}"`:`Type in ${NAMES[lg]}: "${w.meaning}"`,w.word,null,null,w.word):lis();
    if(lv===0)out.push(t2m(),m2t());
    else if(lv===1)out.push(t2m(),m2t(),typ());
    else{out.push(m2t(),typ());if(latin)out.push(lis())}
  });
  if(lv>0)out=shuf(out);
  const s=SN[g];
  if(s&&lv>=1){
    const wr=shuf(SN.filter(x=>x.idx!==s.idx).map(x=>x.meaning)).slice(0,3);
    out.push(mk('choice',ar?`ماذا تعني "${s.text}"؟`:`What does "${s.text}" mean?`,s.meaning,shuf([s.meaning,...wr]),s.romanization,s.text));
    if(lv===2)out.push(mk('order',ar?`رتّب: "${s.meaning}"`:`Order: "${s.meaning}"`,s.text,shuf(s.text.split(' ')),s.romanization,null));
  }
  return out;
}

async function startLesson(id,xp,done,order,unit){
  if(S.p.hearts<=0){app.innerHTML=topbar(true)+toast('خلصت قلوبك اليوم. ارجع بكرة لتكمل.')+'<button onclick="mapView()">رجوع</button>';return}
  if(!CACHE[unit]){
    const[v,s]=await Promise.all([sb.from('vocab').select('*').eq('unit_id',unit).order('idx'),sb.from('sentences').select('*').eq('unit_id',unit).order('idx')]);
    CACHE[unit]={v:v.data||[],s:s.data||[]};
  }
  const c=CACHE[unit];let ex=[];
  if(c.v.length>=3*((order-1)%10+1))ex=buildStage(order,c.v,c.s);
  else{const{data}=await sb.from('exercises').select('*').eq('lesson_id',id).order('sort_order');ex=data||[]}
  if(!ex.length){alert('هذا الدرس فاضي بعد');return}
  Object.assign(S,{ex,i:0,right:0,lesson:{id,xp,done,order},retried:{}});
  exView();
}

function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=TTS[S.lang.id];speechSynthesis.speak(u)}catch(e){}}

function exView(){
  const e=S.ex[S.i];S.sel=null;S.picked=[];S.fb=null;
  const pct=Math.round(S.i/S.ex.length*100);
  let body='';
  if(e.type==='order'){
    S.opts=(e.options||[]).slice().sort(()=>Math.random()-.5);
    body=`<div class="chips" id="ans"></div><div class="chips" id="pool"></div>`;
  }else if(e.type==='write'){
    body=`<input id="wr" class="ltr" style="text-align:left" placeholder="اكتب الإجابة" autocomplete="off" autocapitalize="off">`;
  }else{
    S.opts=(e.options||[]).slice().sort(()=>Math.random()-.5);
    body=S.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('');
  }
  app.innerHTML=`<div class="bar"><span onclick="mapView()" style="cursor:pointer">✕</span><div class="prog"><i style="width:${pct}%"></i></div><span>❤️ ${S.p.hearts}</span></div>
  <div class="q">${esc(e.prompt)} ${e.audio_text?'<span id="spk" style="cursor:pointer">🔊</span>':''}</div>${e.romanization?`<div class="rom ltr">${esc(e.romanization)}</div>`:''}${body}<div class="sp"></div>
  <div class="fb" id="foot" style="background:var(--sand)"><button id="chk" disabled>تحقق</button></div>`;
  if(e.audio_text){document.getElementById('spk').onclick=()=>speak(e.audio_text);if(e.type==='listen')speak(e.audio_text)}
  const chk=document.getElementById('chk');
  if(e.type==='order'){
    const draw=()=>{
      document.getElementById('ans').innerHTML=S.picked.map(k=>`<button class="chip" data-k="${k}">${esc(S.opts[k])}</button>`).join('');
      document.getElementById('pool').innerHTML=S.opts.map((o,k)=>S.picked.includes(k)?'':`<button class="chip" data-k="${k}">${esc(o)}</button>`).join('');
      document.querySelectorAll('.chips .chip').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;S.picked=S.picked.includes(k)?S.picked.filter(x=>x!==k):[...S.picked,k];draw()});
      chk.disabled=!S.picked.length;
    };draw();
  }else if(e.type==='write'){
    document.getElementById('wr').oninput=ev=>{chk.disabled=!ev.target.value.trim()};
  }else{
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.sel=S.opts[+b.dataset.k];chk.disabled=false});
  }
  chk.onclick=()=>check(e);
}

async function check(e){
  const given=e.type==='order'?S.picked.map(k=>S.opts[k]).join(' '):e.type==='write'?document.getElementById('wr').value:S.sel;
  const ok=norm(given)===norm(e.answer);
  const foot=document.getElementById('foot');
  foot.className='fb '+(ok?'ok':'no');
  foot.innerHTML=`${ok?'ممتاز! ✓':'الإجابة الصحيحة: <span class="ltr" style="display:inline-block">'+esc(e.answer)+'</span>'}<button id="nx">متابعة</button>`;
  if(ok){S.right++}else{
    S.p.hearts=Math.max(0,S.p.hearts-1);
    sb.from('profiles').update({hearts:S.p.hearts}).eq('id',S.user.id).then(()=>{});
    if(!S.retried[e.id]){S.retried[e.id]=1;S.ex.push(e)}
  }
  document.getElementById('nx').onclick=()=>{
    if(S.p.hearts<=0)return endView(false);
    S.i++;S.i>=S.ex.length?endView(true):exView();
  };
}

async function endView(win){
  let bonus=false;
  if(win){
    const last=S.p.last_active,t=today(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    const streak=last===t?S.p.streak:last===y?S.p.streak+1:1;
    S.p.xp+=S.lesson.xp;S.p.streak=streak;S.p.last_active=t;
    if(!S.lesson.done&&S.lesson.order%10===0){S.p.hearts=Math.min(10,S.p.hearts+1);bonus=true}
    await sb.from('user_progress').upsert({user_id:S.user.id,lesson_id:S.lesson.id,score:S.right});
    await sb.from('profiles').update({xp:S.p.xp,streak,last_active:t,hearts:S.p.hearts}).eq('id',S.user.id);
  }
  app.innerHTML=`<div class="big">${win?'🎉':'💔'}</div><h2 style="text-align:center">${win?'أنهيت المرحلة!':'خلصت القلوب'}</h2>
  <p class="sub" style="text-align:center">${win?`ربحت ${S.lesson.xp} نقطة خبرة · سلسلتك ${S.p.streak} يوم 🔥`:'ارجع بكرة وكمّل من وين وقفت.'}</p>${bonus?'<p class="sub" style="text-align:center;font-weight:800;color:var(--coral)">❤️ مبروك! ربحت قلب جديد</p>':''}<button onclick="mapView()">متابعة</button>`;
}

sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')authView()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
<script src="/ui.js"></script>
</body>
</html>
